# Runs noface's boot script once the user drive is mounted. KMC's own boot hook
# (kmc.conf) runs /mnt/us/emergency.sh too early, before /mnt/us exists.
# Install as /etc/upstart/noface-autostart.conf. Delete it to undo; nothing else changes.
start on user_store_available

task

script
    [ -f /mnt/us/emergency.sh ] && /bin/sh /mnt/us/emergency.sh
    exit 0
end script
