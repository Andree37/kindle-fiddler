# Opens noface when the Kindle starts, if "Open noface when the Kindle starts" is on
# (Aa > More). noface installs this file itself when that's switched on; delete it
# to undo, nothing else changes. It waits for the user drive, where noface lives.
start on user_store_available

task

script
    [ -f /mnt/us/noface/autostart.sh ] && /bin/sh /mnt/us/noface/autostart.sh
    exit 0
end script
